<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Menu - Kopi Nusantara</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f7f5f0;
            color: #333333;
            padding: 35px 20px;
        }
        .form-card {
            max-width: 580px;
            margin: 0 auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }
        .form-header {
            margin-bottom: 25px;
            border-bottom: 1px solid #efebe9;
            padding-bottom: 15px;
        }
        .form-header h2 {
            color: #4e342e;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .form-header p {
            color: #795548;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #4e342e;
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d7ccc8;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #6d4c41;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        .btn-save {
            flex: 2;
            padding: 11px;
            background-color: #4e342e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-save:hover {
            background-color: #3e2723;
        }
        .btn-back {
            flex: 1;
            padding: 11px;
            background-color: #efebe9;
            color: #5d4037;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-back:hover {
            background-color: #d7ccc8;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h2>Tambah Menu Baru</h2>
            <p>Masukkan rincian informasi menu sajian baru ke dalam katalog</p>
        </div>

        <form action="" method="POST">
            <div class="form-group">
                <label>Kode Menu</label>
                <input type="text" class="form-control" placeholder="Contoh: CF-003" required>
            </div>

            <div class="form-group">
                <label>Nama Menu</label>
                <input type="text" class="form-control" placeholder="Contoh: Caramel Macchiato" required>
            </div>

            <div class="form-group">
                <label>Kategori Sajian</label>
                <select class="form-control" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Kopi">Kopi</option>
                    <option value="Non-Kopi">Non-Kopi</option>
                    <option value="Makanan Ringan">Makanan Ringan</option>
                </select>
            </div>

            <div class="form-group">
                <label>Harga Normal (Rupiah)</label>
                <input type="number" class="form-control" placeholder="Contoh: 25000" min="1000" required>
            </div>

            <div class="form-group">
                <label>Status Program Promo</label>
                <select class="form-control" required>
                    <option value="Tidak">Tidak Ada Promo</option>
                    <option value="Ya">Promo Aktif (Diskon 10%)</option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-save">Simpan Menu</button>
                <a href="index.php" class="btn-back">Batal</a>
            </div>
        </form>
    </div>

</body>
</html>
